<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Architect3D">
  <!--
    The application's own mark (RM-013 K3).

    The same two elements the top bar has carried since S7 - the accent square
    and lucide's ruler - drawn at 512 so a rasteriser has something to work
    from. Nothing new was designed: an icon that did not match the thing it
    launches would be worse than no icon, and an install prompt is the first
    place the two are seen side by side.

    Full bleed, deliberately. A maskable icon is cropped to whatever shape the
    platform uses, and the safe zone is the middle 80% - so the glyph sits in
    the centre 320 px and the corners carry nothing but ground.
  -->
  <rect width="512" height="512" fill="#d9601a"/>
  <g transform="translate(256 256) scale(11.6) translate(-12 -12)"
     fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/>
    <path d="m14.5 12.5 2-2"/>
    <path d="m11.5 9.5 2-2"/>
    <path d="m8.5 6.5 2-2"/>
    <path d="m17.5 15.5 2-2"/>
  </g>
</svg>
