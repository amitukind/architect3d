# Publish the application and the documentation site to Cloudflare Pages.
#
# RM-015 M1. This is the first address this project has had.
#
# WHAT CAME BEFORE, AND WHY IT NEVER PUBLISHED
#
# The previous version of this file targeted GitHub Pages and never once served
# a page. `actions/configure-pages` fails unless Settings -> Pages -> Source is
# set to "GitHub Actions", that switch was never thrown, and RM-006 removed the
# push trigger rather than leave a workflow that went red on every push to the
# default branch - a red mark everybody learns to ignore is worse than none.
#
# RM-015 AA-1 measured the consequence rather than assuming it: both addresses
# the README advertised returned HTTP 404, and the README linked to them nine
# times. The front page of this repository was advertising an application that
# had never existed at that address.
#
# EVERYTHING ABOVE THE PUBLISH STEP IS UNCHANGED, DELIBERATELY
#
# Checkout, install, the full suite with coverage, both builds, the size budgets
# and the assembly are exactly what they were. They are not new and they are not
# untested: they ran, green, on every one of those red pushes, and only the
# three GitHub-Pages-specific actions at the end ever failed. So this swaps the
# last three steps and touches nothing else.
#
# WHAT CHANGED BESIDES THE HOST
#
#   --base       gone. Cloudflare Pages serves a project at the root of its own
#                domain, so the application no longer lives under a repository
#                sub-path and the hashed asset URLs need no prefix. RM-015 AA-2
#                measured what that costs: one production file names the base
#                (the VitePress config, which already reads DOCS_BASE), and
#                everything else in the tree is relative on purpose - including
#                the service worker, which asks `registration.scope` at runtime
#                and hard-codes nothing.
#
#   .nojekyll    gone. It existed to stop GitHub Pages running the artifact
#                through Jekyll and dropping every path beginning with an
#                underscore. Cloudflare does not run Jekyll, and a file whose
#                only comment explains a host we no longer use is a file that
#                will mislead the next reader.
#
#   permissions  down to `contents: read`. `pages: write` and `id-token: write`
#                existed for the OIDC handshake `deploy-pages` needed.
#
# BRANCH POLICY (deliberate, and it is the same Actions-minutes argument ci.yml
# makes - see the note there)
#
#   - push to `master` publishes to production. This is now safe in a way it was
#     not on Pages: Pages has exactly one live deployment, so any deploy from a
#     working branch would have overwritten what people were using. Cloudflare
#     gives every non-production branch its own preview URL, which is precisely
#     the constraint that kept the trigger off before.
#
#   - `workflow_dispatch` from any other branch publishes a PREVIEW at that
#     branch's own URL. Run by hand rather than on every push, because CI
#     already proves `dev` and this job re-runs the whole suite on top of it -
#     paying twice for the same proof on every push is the trade this repository
#     has consistently declined.
#
# WHAT THIS NEEDS BEFORE IT CAN RUN
#
# Two repository secrets and one Pages project. Until they exist the job fails
# at the guard below with a sentence saying which is missing, rather than deep
# inside wrangler with a 401:
#
#   CLOUDFLARE_API_TOKEN    a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   the account the project lives in
#
# The project name defaults to the repository name and can be overridden with
# the `CLOUDFLARE_PROJECT` repository variable, so a project that already exists
# under another name does not require editing this file.
name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Never deploy two commits at once, and never cancel a deploy half-published -
# unlike CI, where cancelling the older run is free.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the deploy is configured
        # Before npm ci, so a repository without the secrets fails in ten
        # seconds with a sentence rather than after a four-minute build with a
        # 401 from wrangler. The token is never printed; only whether it is set.
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Deploy is not configured. Missing repository secret(s):$missing"
            echo "See the header of .github/workflows/deploy.yml for what each one needs."
            exit 1
          fi
          echo "Cloudflare credentials are present."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        env:
          # See the note in ci.yml: simple-git-hooks installs from its own
          # postinstall and honours only this variable, not CI.
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
        run: npm ci --no-audit --no-fund

      - name: Test
        # The deploy does not trust CI to have run on this commit - a push to
        # master can arrive by a route that never touched dev.
        #
        # With coverage since RM-002 P1, for the same reason: if this job is
        # willing to re-run the suite rather than trust CI, it should re-run the
        # same suite CI runs, thresholds included.
        run: npm run test:coverage

      - name: Build the application
        # No --base. Cloudflare serves the project at the root of its domain, so
        # the hashed asset URLs need no prefix and the relative model and
        # texture URLs resolve exactly as they do in dev. See index.html.
        run: npm run build:demo

      - name: Build the documentation
        env:
          DOCS_BASE: /docs/
        run: npm run docs:build

      - name: Size budgets
        # Before assembly, not after: the next step moves the built docs *into*
        # dist-demo, and the demo-total budget measures what the application
        # build produced, not what the deploy job then stacks on top of it.
        run: npm run budget

      - name: Deploy checks
        # RM-015 M1, gate seventeen. Runs against the assembled tree below, so
        # it is the last thing before the upload rather than part of the build:
        # what it checks is that what is about to be published resolves at the
        # base it is about to be published at.
        run: |
          mv docs/.vitepress/dist dist-demo/docs
          npm run deploy:check

      - name: Report what is being published
        run: |
          echo "### Deploy contents" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist-demo >> "$GITHUB_STEP_SUMMARY"
          du -sh dist-demo/* >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch decides production versus preview. Cloudflare treats the
          # project's configured production branch as production and gives every
          # other branch its own URL, which is the whole reason a push trigger is
          # safe here and was not on Pages.
          command: >-
            pages deploy dist-demo
            --project-name=${{ vars.CLOUDFLARE_PROJECT || github.event.repository.name }}
            --branch=${{ github.ref_name }}

      - name: Lighthouse, against what was just published
        # The field half of M-53. CI runs the same analysis against the tree
        # served from localhost and gates on it; this one runs against the real
        # address, over the real CDN, and only reports.
        #
        # Not a gate, on purpose. A cold edge cache, a slow region or a
        # rate-limited run would fail a deploy that published a perfectly good
        # build, and a red mark nobody can act on is the failure mode RM-006
        # removed the last one for. What it is good for is the difference: if
        # the lab says 62 and the network says 40, that gap is the host's, and
        # nothing else in this repository could have told us.
        if: always() && steps.publish.outputs.deployment-url != ''
        continue-on-error: true
        run: |
          npx playwright install chromium
          node tools/check-lighthouse.mjs --url="${{ steps.publish.outputs.deployment-url }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Say where it went
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- branch: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- url: ${{ steps.publish.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
