<!DOCTYPE html>
<html lang="en">
<head>
<!--
  The Vue application (migration sprints S6-S7). Hand-written source: it
  replaced a generated copy of the jQuery demo, which S9 retired along with the
  build/ directory both of them lived in.

  Nothing here loads a vendored script. No jQuery, no Bootstrap, no dat.GUI, no
  glyphicon webfont - the stylesheet is the application's own and the icons are
  inline SVG.

  Why there is no <base> tag
  --------------------------
  There used to be one, pointing at /build/. Every asset URL in this project is
  a bare relative string composed at RUNTIME, not at build time: the library
  asks for 'rooms/textures/wallmap.png', the catalog for 'models/js-glb/*.glb',
  the inspector for 'rooms/thumbnails/*.png', and every saved .blueprint3d file
  carries the same form inside it. While the files lived under build/, one
  <base> redirected all of them without rewriting a single URL.

  S9 moved them to public/, which Vite serves at the site root in dev and copies
  to the root of dist-demo/ on build - so those same strings now resolve without
  help. That they are relative rather than root-absolute is what made the
  deploy portable: under a sub-path the page is served from /architect3d/ and
  'models/x.glb' resolves against it, and at a root it resolves against that.
  A leading slash would have committed to one of those, and a <base> would
  have had to know the deploy path. RM-015 M1 moved the deploy from a
  sub-path to a root and changed nothing here, which is the whole point.

  The module entry below is root-absolute because Vite rewrites it at build
  time - it is the one URL here that is not resolved by the browser at runtime.
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architect3D - Floorplan</title>
<!--
  Installable, since RM-013 K3. Every href here is relative for the reason the
  note above gives about <base>: the deploy is at a root and an embedder may
  serve it under a sub-path, and a leading slash would resolve to the wrong
  one of those.
-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/architect3d.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#d9601a">

<script type="module" src="/src/app/main.js"></script>
</head>

<body>
	<div id="app"></div>
</body>
</html>
