<!DOCTYPE html>
<html lang="en">
<head>
<!--
  The Vue application (migration sprint S6). This file is hand-written source;
  it replaced a generated copy of the jQuery demo, which now lives at
  /legacy.html (run `npm run legacy:index`) for as long as build/ is the frozen
  reference.

  <base href="/build/">
  ---------------------
  Every asset URL in this project is a bare relative string composed at
  RUNTIME, not at build time: the library asks for 'rooms/textures/wallmap.png'
  and the catalog for 'models/js-glb/....glb', and saved designs carry the same
  form inside them. Those resolve against the page URL, and the files live
  under build/.

  One <base> tag points all of them at the right place without rewriting a
  single URL - in the library, in the catalog, or in any .blueprint3d file
  anyone has ever saved. S9 moves build/ to public/ and this tag goes away;
  until then the alternative is an asset-base parameter threaded through every
  loader, which is churn for a directory that is already scheduled to move.

  The two script/style URLs below are root-absolute on purpose, so <base> does
  not apply to them.
-->
<base href="/build/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architect3D - Floorplan</title>

<!--
  Bootstrap's stylesheet and the glyphicon font it points at, still supplying
  .btn and .glyphicon. Its JavaScript is gone with this sprint - the modal and
  the accordion it used to drive are Vue components now - and S7 removes the
  stylesheet too, along with the last of the glyphicons.
-->
<link rel="stylesheet" href="/build/css/bootstrap.min.css">

<script type="module" src="/src/app/main.js"></script>
</head>

<body>
	<div id="app"></div>
</body>
</html>
